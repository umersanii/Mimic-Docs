site_name: Mimic Docs
site_description: Mimic — a webcam-controlled, tendon-driven robotic hand. Architecture, build, and simulation docs.
site_url: https://umersanii.github.io/Mimic-Docs/
repo_url: https://github.com/umersanii/Mimic-Docs
repo_name: umersanii/Mimic-Docs
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/hand-front-right-outline
  favicon: material/hand-front-right-outline.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Vision Pipeline: vision.md
  - Firmware & Serial Protocol: firmware.md
  - Hardware & BOM: hardware.md
  - Simulation (Gazebo): simulation.md
  - Glossary: glossary.md
  - Contributing: contributing.md
